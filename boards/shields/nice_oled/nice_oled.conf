# SSD1306
CONFIG_ZMK_DISPLAY=y
CONFIG_I2C=y
CONFIG_SSD1306=y
CONFIG_ZMK_EXT_POWER=y

# Disable nice!oled custom widgets (incompatible with LVGL 9.x / Zephyr 4.1).
# The built-in ZMK status screen will be used instead.
# Re-enable once the module is ported to LVGL 9.x.
CONFIG_NICE_OLED_ON=n
CONFIG_NICE_EPAPER_ON=n
CONFIG_NICE_CUSTOM_ON=n
